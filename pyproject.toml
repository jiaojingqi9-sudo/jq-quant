[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taa-futu"
version = "3.0.0"
description = "Reproduce a practical tactical asset allocation paper and route signals into Futu simulated trading."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "futu-api==10.0.6008",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "streamlit>=1.43.0",
  "tabulate>=0.9.0",
  "websockets>=16.0",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
taa-futu = "taa_futu.cli:main"
taa-futu-panel = "taa_futu.control_panel:main"
taa-futu-unified = "taa_futu.unified_panel:main"
# 曾有 taa-futu-app 指向 unified_app.py（pywebview 原生窗口壳）。那个模块依赖
# 从未装进 dependencies 的 pywebview，实际执行只会退化成打开浏览器，与
# `taa-futu dashboard` 完全等价，且无任何调用方。2026-07-31 连同模块一起删除。
# 现在要开界面就用桌面上的寻宝猫，或直接 streamlit run src/taa_futu/dashboard_app.py。

[tool.pytest.ini_options]
pythonpath = ["src", "claude-trade/src"]

[tool.setuptools.packages.find]
where = ["src"]
