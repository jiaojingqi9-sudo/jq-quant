[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-trade"
version = "0.1.0"
description = "Multi-market trading bot supporting US stocks (Futu) and crypto (CCXT) with adaptive strategies."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ccxt>=4.0.0",
  "dash>=2.14.0",
  "futu-api>=10.0.6008",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
claude-trade = "claude_trade.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
